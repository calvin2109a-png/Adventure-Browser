<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adventure Browser Passwords</title>
  <style>
    :root {
      color: #112c2a;
      background: #f0fbfa;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 36px 20px;
      background: linear-gradient(180deg, #e9fffb 0%, #cdeee5 42%, #f7fbfd 100%);
      color: #072d29;
    }

    .page {
      width: min(100%, 960px);
      background: white;
      border-radius: 28px;
      border: 1px solid rgba(9, 48, 45, 0.08);
      box-shadow: 0 38px 120px rgba(20, 74, 68, 0.12);
      overflow: hidden;
    }

    .hero {
      padding: 30px 36px;
      background: linear-gradient(135deg, #46b89d 0%, #1a7b69 100%);
      color: white;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 3vw, 3.4rem);
      line-height: 1.05;
    }

    .hero p {
      margin: 0;
      max-width: 780px;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.7;
    }

    .content {
      display: grid;
      gap: 24px;
      padding: 30px 36px 40px;
    }

    .form-grid {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 10px;
      color: #103634;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      border: 1px solid #c4e1d8;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      background: #f8fffd;
      color: #103634;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .save {
      background: #1b7f66;
      color: white;
      box-shadow: 0 16px 30px rgba(27, 127, 102, 0.18);
    }

    .clear {
      background: #f5fbfb;
      color: #12534a;
      border: 1px solid #b7e2d9;
    }

    .password-list {
      display: grid;
      gap: 16px;
    }

    .password-card {
      padding: 22px;
      border-radius: 22px;
      background: #f8fffe;
      border: 1px solid #d5ede4;
      box-shadow: 0 14px 35px rgba(22, 81, 74, 0.08);
    }

    .password-card strong {
      display: block;
      font-size: 0.98rem;
      margin-bottom: 10px;
      color: #0d2f2b;
    }

    .password-card span {
      display: block;
      color: #1e4e49;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .password-card .remove {
      display: inline-flex;
      margin-top: 14px;
      background: #ffebe6;
      color: #9b1c15;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(155, 28, 21, 0.15);
      font-weight: 700;
    }

    .empty-state {
      padding: 28px;
      border-radius: 20px;
      background: #e7f8f4;
      border: 1px dashed #7ac9b4;
      color: #1e4f45;
      text-align: center;
    }

    @media (max-width: 780px) {
      .hero,
      .content {
        padding-left: 24px;
        padding-right: 24px;
      }
    }
  </style>
</head>
<body>
  <article class="page">
    <section class="hero">
      <h1>Password manager</h1>
      <p>Save your login details locally in a dedicated tab. Passwords remain in your browser storage and are easy to manage from here.</p>
    </section>
    <section class="content">
      <form id="passwordForm" class="form-grid">
        <label>
          Site or URL
          <input id="passwordSite" type="text" placeholder="example.com or https://site.com" required />
        </label>
        <label>
          Username / Email
          <input id="passwordAccount" type="text" placeholder="Username or email" required />
        </label>
        <label>
          Password
          <input id="passwordValue" type="password" placeholder="Password" required />
        </label>
        <div class="actions">
          <button class="save" type="submit">Save credential</button>
          <button class="clear" type="button" id="clearAll">Clear all</button>
        </div>
      </form>
      <div class="password-list" id="passwordList"></div>
    </section>
  </article>
  <script>
    const storageKey = 'adventure-browser-passwords';

    const form = document.getElementById('passwordForm');
    const siteInput = document.getElementById('passwordSite');
    const accountInput = document.getElementById('passwordAccount');
    const passwordInput = document.getElementById('passwordValue');
    const passwordList = document.getElementById('passwordList');
    const clearAllButton = document.getElementById('clearAll');

    function loadCredentials() {
      try {
        const stored = localStorage.getItem(storageKey);
        return stored ? JSON.parse(stored) : [];
      } catch {
        return [];
      }
    }

    function saveCredentials(items) {
      localStorage.setItem(storageKey, JSON.stringify(items));
      renderCredentials(items);
    }

    function renderCredentials(items) {
      if (!items.length) {
        passwordList.innerHTML = '<div class="empty-state">No saved credentials yet. Add one to start.</div>';
        return;
      }

      passwordList.innerHTML = items.map((item, index) => `
        <div class="password-card">
          <strong>${item.site}</strong>
          <span><strong>Username:</strong> ${item.account}</span>
          <span><strong>Password:</strong> ${item.password}</span>
          <button class="remove" data-index="${index}">Remove</button>
        </div>
      `).join('');

      passwordList.querySelectorAll('.remove').forEach((button) => {
        button.addEventListener('click', () => {
          const index = Number(button.dataset.index);
          const updated = loadCredentials().filter((_, idx) => idx !== index);
          saveCredentials(updated);
        });
      });
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const newCredential = {
        site: siteInput.value.trim(),
        account: accountInput.value.trim(),
        password: passwordInput.value.trim(),
      };
      if (!newCredential.site || !newCredential.account || !newCredential.password) {
        return;
      }

      const items = loadCredentials();
      items.unshift(newCredential);
      saveCredentials(items);
      form.reset();
      siteInput.focus();
    });

    clearAllButton.addEventListener('click', () => {
      localStorage.removeItem(storageKey);
      renderCredentials([]);
    });

    renderCredentials(loadCredentials());
  </script>
</body>
</html>
